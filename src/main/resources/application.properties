# ============================================================
# OmniPost-AI Application Configuration
# ============================================================

# Server
server.port=8080
spring.application.name=OmniPost-AI

# ============================================================
# File Upload Limits
# ============================================================
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# ============================================================
# Storage Directories
# ============================================================
omnipost.storage.video-dir=uploads/videos
omnipost.storage.thumbnail-dir=uploads/thumbnails

# ============================================================
# H2 In-Memory Database (development default)
# ============================================================
spring.datasource.url=jdbc:h2:file:./omnipost-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=omnipost
spring.datasource.password=omnipost
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (disable in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# OpenAI Configuration
# Set omnipost.openai.api-key to your OpenAI API key.
# If not set, AI generation falls back to sensible defaults.
# ============================================================
omnipost.openai.api-key=${OPENAI_API_KEY:}
omnipost.openai.model=gpt-4o-mini
omnipost.openai.base-url=https://api.openai.com/v1
omnipost.openai.max-tokens=500

# ============================================================
# YouTube Configuration
# Obtain OAuth2 credentials from Google Cloud Console.
# ============================================================
omnipost.youtube.client-id=${YOUTUBE_CLIENT_ID:}
omnipost.youtube.client-secret=${YOUTUBE_CLIENT_SECRET:}
omnipost.youtube.refresh-token=${YOUTUBE_REFRESH_TOKEN:}
omnipost.youtube.application-name=OmniPost-AI
omnipost.youtube.privacy-status=public
omnipost.youtube.category-id=22

# ============================================================
# Instagram Configuration
# Obtain from Meta Developer Console (Instagram Graph API).
# ============================================================
omnipost.instagram.access-token=${INSTAGRAM_ACCESS_TOKEN:}
omnipost.instagram.account-id=${INSTAGRAM_ACCOUNT_ID:}
omnipost.instagram.base-url=https://graph.facebook.com/v18.0

# ============================================================
# Server Base URL (used to build public video URLs for Instagram)
# Change to your actual public domain/IP in production.
# ============================================================
omnipost.server.base-url=${SERVER_BASE_URL:http://localhost:8080}

# ============================================================
# CORS Configuration
# Comma-separated list of allowed origins.
# IMPORTANT: Restrict to specific trusted domains in production.
# ============================================================
omnipost.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# ============================================================
# Logging
# ============================================================
logging.level.com.omnipost=INFO
logging.level.org.springframework.web=INFO
